<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceFlow - Sistema de Gestión de Servicios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1A1410;
        }
        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1A1410;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            color: #fff;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <iframe id="serviceflow" src="www/serviceflow.html" style="display:none;"></iframe>
        <div class="loading">Cargando ServiceFlow...</div>
    </div>

    <script>
        // Esperar a que cargue el iframe
        const iframe = document.getElementById('serviceflow');
        const loading = document.querySelector('.loading');

        iframe.onload = function() {
            loading.style.display = 'none';
            iframe.style.display = 'block';
        };

        // Mostrar el iframe después de 500ms si no cargó
        setTimeout(() => {
            if (loading.style.display !== 'none') {
                loading.style.display = 'none';
                iframe.style.display = 'block';
            }
        }, 500);
    </script>
</body>
</html>
